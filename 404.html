<style>
:root{
  --bg:#EDF0F4; --panel:#F8FAFC; --ink:#111A24; --ink2:#4B5B6B; --ink3:#5C6A78;

@media (prefers-color-scheme: dark){

    --bg:#0C121A; --panel:#141D28; --ink:#E2E9F1; --ink2:#93A2B2; --ink3:#7F8D9C;

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex; align-items:center; justify-content:center; padding:32px; line-height:1.7;
}
main{max-width:520px; width:100%}
.bars{display:flex; gap:6px; align-items:flex-end; height:44px; margin-bottom:26px}
.bars i{display:block; width:10px; border-radius:2px}
.bars i:nth-child(1){height:30px; background:#7FADDF}
.bars i:nth-child(2){height:44px; background:#79B4BF}
.bars i:nth-child(3){height:22px; background:#C9A45F}
.code{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; letter-spacing:.14em; color:var(--ink3); text-transform:uppercase;
}
h1{font-size:26px; margin:10px 0 14px; font-weight:700; letter-spacing:.01em}
p{margin:0 0 12px; color:var(--ink2); font-size:15px}
.hint{font-size:13.5px; color:var(--ink3)}
a.btn{
  display:inline-block; margin-top:20px; padding:11px 20px; border-radius:8px;
  background:var(--accent); color:var(--on-accent); text-decoration:none;
  font-size:14.5px; font-weight:500; border:1px solid var(--accent);
}
a.btn:hover{opacity:.88}
a.btn:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
hr{border:0; border-top:1px solid var(--line); margin:26px 0 16px}
